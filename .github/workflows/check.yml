name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.8"
          args: format --check
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.8"
          args: check
      - run: npm ci
      - run: npm run build
      - run: git diff --exit-code dist
      - run: npx oxlint
      - run: python3 -m compileall -q scripts eval
      - run: python3 scripts/check_no_comments.py
      - run: python3 scripts/check_no_stubs.py
      - run: echo '{"prompt":"hi","transcript_path":""}' | CLAUDE_CONFIG_DIR="${{ runner.temp }}" python3 scripts/prompt_router.py
      - run: echo '' | node dist/src/compactor.js rows
      - run: echo 'not json' | node dist/src/prompt-router.js
      - run: echo 'not json' | node dist/src/subagent-router.js
      - run: echo 'not json' | node dist/src/rules.js
