apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard
  labels:
    app.kubernetes.io/name: adguard
    app.kubernetes.io/part-of: infra
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: adguard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: adguard
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9617"
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: adguard
          image: adguard/adguardhome:v0.107.65
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: http
              containerPort: 3000
          env:
            - name: TZ
              value: America/Sao_Paulo
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [NET_BIND_SERVICE]
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /control/status
              port: http
            periodSeconds: 10
          volumeMounts:
            - name: work
              mountPath: /opt/adguardhome/work
            - name: conf
              mountPath: /opt/adguardhome/conf
        - name: exporter
          image: ghcr.io/henrywhitaker3/adguard-exporter:v1.1.1
          ports:
            - name: metrics
              containerPort: 9617
          env:
            - name: ADGUARD_SERVERS
              value: http://localhost:3000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      volumes:
        - name: work
          persistentVolumeClaim:
            claimName: adguard-work
        - name: conf
          persistentVolumeClaim:
            claimName: adguard-conf
